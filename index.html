<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0e">
<meta name="description" content="Local car cruises, shows and meetups.">
<title>CruiseNight</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

<script src="config.js"></script>
<script>
  (function () {   // apply the theme before first paint
    var t = new URLSearchParams(location.search).get('theme') || CRUISE_CONFIG.THEME || 'chrome';
    if (!/^(chrome|steel|neon|violet)$/.test(t)) t = 'chrome';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
:root { --radius: 14px; --tabbar: 64px; --bad: #e5484d;
  --brand-font: "Arial Narrow", "Roboto Condensed", system-ui, sans-serif; --brand-glow: none; }

/* Themes. Pick one with THEME in config.js; ?theme=name previews another. */
:root, [data-theme=chrome] {  /* Midnight Chrome: black, polished silver, electric blue */
  color-scheme: dark;
  --bg: #0a0b0e; --surface: #14161b; --surface2: #1c1f26; --line: #2a2e37; --hover-line: #3b404b;
  --text: #f1f3f7; --muted: #a2a9b6; --accent: #6ea8ff; --accent-ink: #06122a; --err: #ffb3c8;
  --cruise: #6ea8ff; --show: #f472b6; --meetup: #c4b5fd;
  --header-bg: rgba(10,11,14,.92); --tab-bg: rgba(20,22,27,.96); --shadow: rgba(0,0,0,.55);
  --good-bg: #12302a; --good-line: #1f5a4c; --good-text: #8ff0d0;
  --bad-bg: #3a1526; --bad-line: #6a2a45; --bad-text: #ffb3c8;
  --banner-bg: #101c33; --banner-line: #1f335a; --banner-text: #b9d3ff;
  --logo-tile: #0a0b0e; --arch-hi: #ffffff; --arch-lo: #7d8796; --road: #1c1f26; --road-line: #d7dde6; --road-edge: #2a2e37;
}
[data-theme=steel] {          /* Gateway Steel: daylight, stainless arch, navy */
  color-scheme: light;
  --bg: #f3f5f8; --surface: #ffffff; --surface2: #eef1f5; --line: #d9dee6; --hover-line: #aeb7c4;
  --text: #0f172a; --muted: #475569; --accent: #1e40af; --accent-ink: #ffffff; --err: #b91c1c;
  --cruise: #1d4ed8; --show: #be185d; --meetup: #6d28d9;
  --header-bg: rgba(255,255,255,.92); --tab-bg: rgba(255,255,255,.96); --shadow: rgba(15,23,42,.18);
  --good-bg: #dcfce7; --good-line: #86efac; --good-text: #166534;
  --bad-bg: #fee2e2; --bad-line: #fca5a5; --bad-text: #991b1b;
  --banner-bg: #eef4ff; --banner-line: #c7d7fe; --banner-text: #1e3a8a;
  --logo-tile: #0f1e3d; --arch-hi: #ffffff; --arch-lo: #8b97a6; --road: #1e2f55; --road-line: #e2e8f0; --road-edge: #2c3f6b;
}
[data-theme=neon] {           /* Route 66 Neon: diner-sign pink and cyan on midnight blue */
  color-scheme: dark;
  --bg: #0b0f24; --surface: #131a38; --surface2: #1b2349; --line: #2a3466; --hover-line: #3d4a8a;
  --text: #eef2ff; --muted: #a5b0d6; --accent: #ff3ea5; --accent-ink: #1a0010; --err: #ffb3d0;
  --cruise: #22d3ee; --show: #ff3ea5; --meetup: #a78bfa;
  --header-bg: rgba(11,15,36,.92); --tab-bg: rgba(19,26,56,.96); --shadow: rgba(0,0,0,.55);
  --good-bg: #123a3a; --good-line: #1f6a6a; --good-text: #8ff0e0;
  --bad-bg: #3a1530; --bad-line: #6a2a58; --bad-text: #ffb3dd;
  --banner-bg: #2a1838; --banner-line: #4d2a5e; --banner-text: #ffb3dd;
  --logo-tile: #0b0f24; --arch-hi: #ffffff; --arch-lo: #ff3ea5; --road: #1b2349; --road-line: #22d3ee; --road-edge: #2a3466;
  --brand-glow: 0 0 10px rgba(255,62,165,.55);
}
[data-theme=violet] {         /* Ultraviolet: black-cherry purple, silver, hot pink */
  color-scheme: dark;
  --bg: #0f0a1a; --surface: #181127; --surface2: #21183a; --line: #33264f; --hover-line: #4a3a70;
  --text: #f4effc; --muted: #b6a9d0; --accent: #c77dff; --accent-ink: #16052a; --err: #ffb3d6;
  --cruise: #c77dff; --show: #ff6fb5; --meetup: #7dd3fc;
  --header-bg: rgba(15,10,26,.92); --tab-bg: rgba(24,17,39,.96); --shadow: rgba(0,0,0,.55);
  --good-bg: #13302c; --good-line: #22584f; --good-text: #96f0d6;
  --bad-bg: #3d1430; --bad-line: #6d2955; --bad-text: #ffb3d6;
  --banner-bg: #24163d; --banner-line: #3d2766; --banner-text: #dcc6ff;
  --logo-tile: #0f0a1a; --arch-hi: #ffffff; --arch-lo: #9d7bd8; --road: #21183a; --road-line: #ff6fb5; --road-edge: #33264f;
  --brand-glow: 0 0 10px rgba(199,125,255,.45);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round; flex: none; }

.top { position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; background: var(--header-bg);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); margin-right: auto; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand span, h1, h2 { font-family: var(--brand-font);
  font-style: italic; font-weight: 800; letter-spacing: .3px; }
.brand span { font-size: 22px; text-shadow: var(--brand-glow); }
.brand span b { color: var(--accent); font-weight: 800; }

#demoBanner { background: var(--banner-bg); color: var(--banner-text); font-size: 13px; padding: 8px 16px; border-bottom: 1px solid var(--banner-line); }
main { max-width: 760px; margin: 0 auto; padding: 16px 16px calc(var(--tabbar) + env(safe-area-inset-bottom) + 24px); }
main.full { max-width: none; padding: 0; }

.tabbar { position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0; display: flex;
  height: calc(var(--tabbar) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--tab-bg); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600; }
.tabbar a.on { color: var(--accent); }
.tabbar a.submit span.plus { display: flex; align-items: center; justify-content: center; width: 44px; height: 30px;
  border-radius: 10px; background: var(--accent); color: var(--accent-ink); }
.tabbar a.submit.on span.plus { box-shadow: 0 0 0 2px var(--text); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); color: var(--text);
  font-weight: 650; text-decoration: none; cursor: pointer; min-height: 44px; transition: border-color .15s, background-color .15s; }
.btn:hover { border-color: var(--hover-line); }
.btn:active, .chip:active, .card:active { opacity: .85; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.good { background: var(--good-bg); border-color: var(--good-line); color: var(--good-text); }
.btn.danger { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad-text); }
.btn.small { padding: 7px 12px; font-size: 14px; border-radius: 10px; min-height: 40px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

h1 { font-size: 30px; line-height: 1.1; margin: 4px 0 8px; }
h2 { font-size: 22px; margin: 22px 0 10px; }
.muted { color: var(--muted); }
.err { color: var(--err); }

/* list */
.hero { padding: 6px 0 4px; }
.hero p { margin: 0; color: var(--muted); }
.search { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); margin: 12px 0 10px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; min-height: 40px; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip svg.i { width: 16px; height: 16px; }
.day { margin: 22px 0 8px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.day.today { color: var(--accent); }
.card { display: grid; grid-template-columns: 92px 1fr; gap: 14px; padding: 10px; margin-bottom: 10px;
  border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); color: var(--text); text-decoration: none; }
.card:hover { border-color: var(--hover-line); }
.thumb { width: 92px; height: 116px; border-radius: 10px; overflow: hidden; background: var(--surface2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.ph svg { width: 70%; fill: rgba(0,0,0,.45); }
.ph.k-cruise { background: linear-gradient(150deg, #b9d3ff, #2b5fb8); }
.ph.k-show { background: linear-gradient(150deg, #ffb3d6, #b0306f); }
.ph.k-meetup { background: linear-gradient(150deg, #ddd0ff, #6247b0); }
.card h3 { margin: 2px 0 4px; font-size: 18px; line-height: 1.2; }
.meta { color: var(--muted); font-size: 14px; }
.meta + .meta { margin-top: 2px; }
.kind { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.kind.k-cruise { color: var(--cruise); } .kind.k-show { color: var(--show); } .kind.k-meetup { color: var(--meetup); }
.empty { text-align: center; padding: 40px 10px; color: var(--muted); }
.foot { text-align: center; margin-top: 30px; font-size: 14px; color: var(--muted); }
.foot a { color: var(--muted); }
.offline { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14px; color: var(--muted); margin-top: 10px; }

/* detail */
.poster { display: block; width: calc(100% + 32px); margin: -16px -16px 14px; background: #000; border: 0; padding: 0; cursor: zoom-in; }
.poster img { display: block; width: 100%; max-height: 70vh; object-fit: contain; }
.poster .ph { height: 180px; }
.poster .ph svg { width: 140px; }
.facts { display: grid; gap: 12px; margin: 14px 0; }
.fact { display: flex; gap: 12px; align-items: flex-start; }
.fact svg.i { color: var(--accent); margin-top: 2px; }
.fact b { display: block; }
.fact a { color: var(--text); }
.navalt { font-size: 14px; color: var(--muted); margin-top: 4px; }
.navalt a { color: var(--muted); }
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
.actions .btn, .actions summary { flex-direction: column; gap: 4px; padding: 10px 4px; font-size: 13px; width: 100%; }
.actions details { position: relative; }
.actions summary { list-style: none; }
.actions summary::-webkit-details-marker { display: none; }
.menu { position: absolute; z-index: 5; top: calc(100% + 6px); left: 0; min-width: 210px; background: var(--surface2);
  border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 10px 30px var(--shadow); }
.menu a, .menu button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; border: 0;
  background: none; color: var(--text); text-decoration: none; cursor: pointer; }
.menu a:hover, .menu button:hover { background: var(--surface); }
.desc { white-space: pre-wrap; overflow-wrap: anywhere; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 14px 0; }
.box h2 { margin-top: 0; font-size: 18px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.dates { display: flex; flex-wrap: wrap; gap: 6px; }
.dates a { padding: 6px 10px; border-radius: 9px; background: var(--surface2); border: 1px solid var(--line);
  color: var(--text); text-decoration: none; font-size: 14px; }
.dates a.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.lightbox { position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,.94); display: flex; align-items: center;
  justify-content: center; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* map */
.mapfull { height: calc(100dvh - 63px - var(--tabbar) - env(safe-area-inset-bottom) - env(safe-area-inset-top)); width: 100%; }
.locate { position: absolute; z-index: 900; right: 12px; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom) + 16px); }
.pin span { position: absolute; left: 3px; top: 0; width: 24px; height: 24px; border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.pin-cruise span { background: var(--cruise); } .pin-show span { background: var(--show); } .pin-meetup span { background: var(--meetup); }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface2); color: var(--text); }
.leaflet-popup-content { margin: 12px 14px; font-size: 14px; }
.leaflet-popup-content b { font-size: 16px; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.me { width: 16px; height: 16px; border-radius: 50%; background: #4c8dff; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(76,141,255,.25); }

/* forms */
form fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px 4px; margin: 0 0 14px; background: var(--surface); }
form legend { padding: 0 6px; font-weight: 800; color: var(--accent); }
form label { display: block; margin-bottom: 12px; font-size: 14px; font-weight: 600; color: var(--muted); }
form input:not([type=checkbox]):not([type=file]), form select, form textarea {
  display: block; width: 100%; margin-top: 4px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); font-weight: 400; }
form input:focus, form select:focus, form textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
form small { display: block; font-weight: 400; margin-top: 4px; }
.row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pickmap { height: 240px; border-radius: 10px; margin: 8px 0 4px; }
.posterprev { max-width: 160px; max-height: 200px; border-radius: 8px; display: block; margin: 8px 0; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.check { display: flex; gap: 8px; align-items: center; color: var(--text); font-weight: 500; }
.skips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 12px; margin-bottom: 12px; }
.formerr { margin: 0 0 12px; }
.formerr li { margin-bottom: 2px; }

/* admin */
.tabs { display: flex; gap: 8px; margin: 10px 0 16px; }
.adm { padding: 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); margin-bottom: 12px; }
.adm .top2 { display: grid; grid-template-columns: 72px 1fr; gap: 12px; }
.adm .thumb { width: 72px; height: 90px; }
.adm h3 { margin: 0 0 4px; font-size: 17px; }
.adm .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: #fff;
  font-size: 12px; font-weight: 800; text-align: center; margin-left: 4px; }

#toast { position: fixed; z-index: 4000; left: 50%; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom) + 14px);
  transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px;
  font-weight: 600; font-size: 14px; box-shadow: 0 8px 24px var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s;
  max-width: calc(100% - 32px); }
#toast.show { opacity: 1; pointer-events: auto; }
#toast button { margin-left: 10px; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 4px 10px; font-weight: 700; cursor: pointer; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media (max-width: 520px) {
  .row { grid-template-columns: 1fr 1fr; }
  .row label:first-child { grid-column: 1 / -1; }
  h1 { font-size: 26px; }
}
</style>
</head>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function safeUrl(u) {
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; }
}
function webUrl(v) {
  v = (v || '').trim(); if (!v) return null;
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v;

}
function socialUrl(kind, v) {
  v = (v || '').trim(); if (!v) return null;
  if (/^https?:\/\//i.test(v)) return safeUrl(v);
  if (/^(www\.|m\.)?(facebook|fb|instagram|tiktok)\.com\//i.test(v)) return safeUrl('https://' + v);
  const h = v.replace(/^@/, '').replace(/[^\w.\-]/g, '');

  return { facebook: `https://www.facebook.com/${h}`, instagram: `https://www.instagram.com/${h}/`,

}

const loaded = {};
function loadScript([src, integrity]) {

// ------------------------------------------------------------------ dates & recurrence
const fmtTime = d => d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const fmtShort = d => d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const fmtLong = d => d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
function dayLabel(d) {
  const diff = Math.round((startOfDay(d) - startOfDay(new Date())) / DAY_MS);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
}
const timeRange = o => fmtTime(o.start) + (o.end ? ' – ' + fmtTime(o.end) : '');

function parseByday(s) {
  const m = /^(-1|[1-4])?([A-Z]{2})$/.exec(s || '');
  return m ? { n: m[1] ? +m[1] : null, dow: DAYS.indexOf(m[2]) } : null;
}
function nthWeekday(y, m, dow, n) {
  if (n === -1) {
    const last = new Date(y, m + 1, 0);
    return new Date(y, m, last.getDate() - ((last.getDay() - dow + 7) % 7));
  }
  const first = new Date(y, m, 1);
  const d = new Date(y, m, 1 + ((dow - first.getDay() + 7) % 7) + (n - 1) * 7);
  return d.getMonth() === m ? d : null;
}

/* Every occurrence of an event that is still running at `from` and starts by `to`.
   Wall-clock times are kept in the device's time zone, so a 6 pm cruise night stays
   at 6 pm across daylight-saving changes. */
function occurrences(ev, from, to, { withSkipped = false } = {}) {
  const s0 = new Date(ev.start_at);
  const dur = ev.end_at ? new Date(ev.end_at) - s0 : null;
  const firstDay = startOfDay(s0);
  const mk = day => {
    const start = new Date(day.getFullYear(), day.getMonth(), day.getDate(), s0.getHours(), s0.getMinutes());
    return { start, end: dur != null ? new Date(start.getTime() + dur) : null, key: dateKey(start) };
  };
  const ends = o => o.end || new Date(o.start.getTime() + DEFAULT_DUR);
  const out = [];
  if (!ev.recur_freq) {
    const o = mk(s0);
    if (ends(o) >= from && o.start <= to) out.push(o);
    return out;
  }
  const until = ev.recur_until ? new Date(parseKey(ev.recur_until).getTime() + DAY_MS - 1) : null;
  const skip = new Set(ev.skip_dates || []);
  const consider = day => {
    if (!day || day < firstDay) return true;
    const o = mk(day);
    if ((until && o.start > until) || o.start > to) return false;
    if (ends(o) >= from) {
      o.skipped = skip.has(o.key);
      if (withSkipped || !o.skipped) out.push(o);
    }
    return true;
  };
  const interval = ev.recur_interval || 1;
  if (ev.recur_freq === 'weekly') {
    const step = 7 * interval;
    const k0 = Math.max(0, Math.floor((from - firstDay) / DAY_MS / step) - 1);
    for (let k = k0; k < k0 + 2000; k++) {
      if (!consider(new Date(firstDay.getFullYear(), firstDay.getMonth(), firstDay.getDate() + k * step))) break;
    }
  } else {
    const bd = parseByday(ev.recur_byday);
    if (!bd) return out;
    const fy = firstDay.getFullYear(), fm = firstDay.getMonth();
    for (let k = 0; k < 1200; k++) {
      const mi = fm + k * interval;
      if (!consider(nthWeekday(fy + Math.floor(mi / 12), mi % 12, bd.dow, bd.n))) break;
    }
  }
  return out;
}
function recurText(ev) {
  if (!ev.recur_freq) return '';
  const bd = parseByday(ev.recur_byday);
  const dn = DAY_NAMES[bd ? bd.dow : new Date(ev.start_at).getDay()];
  let t;
  if (ev.recur_freq === 'weekly') t = ev.recur_interval === 2 ? `Every other ${dn}` : ev.recur_interval > 2 ? `Every ${ev.recur_interval} weeks on ${dn}` : `Every ${dn}`;
  else t = `${bd.n === -1 ? 'Last' : ORD[bd.n]} ${dn} of every month`;
  if (ev.recur_until) t += ` until ${fmtShort(parseKey(ev.recur_until))}`;
  return t;
}
const nextOcc = (ev, now = new Date()) => occurrences(ev, now, new Date(now.getTime() + 400 * DAY_MS))[0] || null;

function weekendRange(now = new Date()) {
  const d = now.getDay();
  const back = d === 6 ? 1 : d === 0 ? 2 : -((5 - d + 7) % 7);
  const fri = new Date(now.getFullYear(), now.getMonth(), now.getDate() - back);
  return [fri, new Date(fri.getFullYear(), fri.getMonth(), fri.getDate() + 3)];
}

// ------------------------------------------------------------------ distance
function distance(a, b) {
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng / 2) ** 2;
  const km = 2 * R * Math.asin(Math.sqrt(h));
  return CFG.UNITS === 'km' ? km : km * 0.621371;
}
const evDist = ev => state.loc && ev.lat != null ? distance(state.loc, [ev.lat, ev.lng]) : null;
const fmtDist = d => (d < 10 ? d.toFixed(1) : Math.round(d)) + ' ' + CFG.UNITS;

// ------------------------------------------------------------------ calendar export
function icsText(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsFold(line) {
  const out = []; let cur = '';
  for (const ch of line) {
    if (new TextEncoder().encode(cur + ch).length > 74) { out.push(cur); cur = ' ' + ch; } else cur += ch;
  }
  out.push(cur); return out.join('\r\n');
}
const icsLocal = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
function rrule(ev) {
  if (!ev.recur_freq) return null;
  let r = `FREQ=${ev.recur_freq === 'weekly' ? 'WEEKLY' : 'MONTHLY'};INTERVAL=${ev.recur_interval || 1};BYDAY=${ev.recur_byday}`;
  if (ev.recur_until) r += `;UNTIL=${ev.recur_until.replace(/-/g, '')}T235959`;
  return r;
}
function eventLink(ev, key) { return location.origin + location.pathname + `#/e/${ev.id}` + (key ? '/' + key : ''); }
function icsFor(ev, occ) {
  const end = occ.end || new Date(occ.start.getTime() + DEFAULT_DUR);
  const now = new Date();
  const stamp = now.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', `PRODID:-//${CFG.APP_NAME}//EN`, 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
    `UID:${ev.id}${ev.recur_freq ? '' : '-' + occ.key}@cruisenight`, `DTSTAMP:${stamp}`,
    `DTSTART:${icsLocal(occ.start)}`, `DTEND:${icsLocal(end)}`];
  const rr = rrule(ev);
  if (rr) {
    lines.push('RRULE:' + rr);
    const hhmm = `T${pad(occ.start.getHours())}${pad(occ.start.getMinutes())}00`;
    for (const k of ev.skip_dates || []) if (k >= occ.key) lines.push(`EXDATE:${k.replace(/-/g, '')}${hhmm}`);
  }
  lines.push(`SUMMARY:${icsText(ev.title)}`,
    `LOCATION:${icsText([ev.venue_name, ev.address].filter(Boolean).join(', '))}`,
    `DESCRIPTION:${icsText((ev.description ? ev.description + '\n\n' : '') + eventLink(ev, occ.key))}`,
    `URL:${eventLink(ev, occ.key)}`);
  if (ev.lat != null) lines.push(`GEO:${ev.lat};${ev.lng}`);
  lines.push('END:VEVENT', 'END:VCALENDAR');
  return lines.map(icsFold).join('\r\n') + '\r\n';
}
function downloadIcs(ev, occ) {
  const blob = new Blob([icsFor(ev, occ)], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (ev.title.replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'event') + '.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function googleCalUrl(ev, occ) {
  const end = occ.end || new Date(occ.start.getTime() + DEFAULT_DUR);
  const p = new URLSearchParams({
    action: 'TEMPLATE', text: ev.title, dates: `${icsLocal(occ.start)}/${icsLocal(end)}`,
    details: (ev.description ? ev.description + '\n\n' : '') + eventLink(ev, occ.key),
    location: [ev.venue_name, ev.address].filter(Boolean).join(', '),
    ctz: Intl.DateTimeFormat().resolvedOptions().timeZone
  });
  const rr = rrule(ev);
  if (rr) p.set('recur', 'RRULE:' + rr);
  return 'https://calendar.google.com/calendar/render?' + p;
}

// ------------------------------------------------------------------ navigation links
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function navLinks(ev) {
  const dest = encodeURIComponent(ev.lat != null ? `${ev.lat},${ev.lng}` : ev.address);
  const l = {
    google: `https://www.google.com/maps/dir/?api=1&destination=${dest}`,
    apple: `https://maps.apple.com/?daddr=${dest}`,
    waze: ev.lat != null ? `https://waze.com/ul?ll=${ev.lat},${ev.lng}&navigate=yes` : `https://waze.com/ul?q=${dest}&navigate=yes`
  };
  l.primary = IS_IOS ? l.apple : l.google;
  return l;
}

// ------------------------------------------------------------------ posters
const thumbPath = p => p.replace(/\.jpg$/, '-t.jpg');
function posterHTML(ev, { thumb = false } = {}) {
  const full = ev.poster_path ? api.posterUrl(ev.poster_path) : null;
  if (!full) return `<div class="ph k-${esc(ev.kind)}">${CAR}</div>`;
  const src = thumb ? (api.posterUrl(thumbPath(ev.poster_path)) || full) : full;
  return `<img src="${esc(src)}" data-full="${esc(full)}" alt="" loading="lazy" onerror="if(this.src!==this.dataset.full){this.src=this.dataset.full}">`;
}
function loadImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file is not an image this browser can read.')); };
    img.src = url;
  });
}
function scaleTo(img, max, quality) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', quality));
}
async function uploadPosterFile(file, base) {
  const img = await loadImage(file);
  const [full, small] = await Promise.all([scaleTo(img, 1600, 0.85), scaleTo(img, 400, 0.8)]);
  if (full.size > 5 * 1024 * 1024) throw new Error('That poster is too large even after shrinking it.');
  const path = base + '.jpg';
  await api.uploadPoster(path, full);
  await api.uploadPoster(thumbPath(path), small).catch(() => {});
  return path;
}
async function removePoster(path) {
  if (!path) return;
  await api.deletePosters([path, thumbPath(path)]).catch(() => {});
}
async function movePoster(path, folder) {
  const to = folder + '/' + path.split('/').pop();
  if (to === path) return path;
  await api.movePoster(path, to);
  await api.movePoster(thumbPath(path), thumbPath(to)).catch(() => {});
  return to;
}

// ------------------------------------------------------------------ backends
let sb;
const supaApi = {
  async init() {
    await loadScript(LIBS.supabase);
    sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  },
  async listPublic() { const { data, error } = await sb.from('public_events').select('*'); if (error) throw error; return data; },
  async goingCounts() { const { data, error } = await sb.rpc('going_counts'); if (error) throw error; return data; },
  async setGoing(id, date, going) {
    const { data, error } = await sb.rpc('set_going', { p_event: id, p_date: date, p_device: deviceId(), p_going: going });
    if (error) throw error; return data;
  },
  posterUrl(path) { return sb.storage.from('posters').getPublicUrl(path).data.publicUrl; },
  async uploadPoster(path, blob) {
    const { error } = await sb.storage.from('posters').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
    if (error) throw error;
  },
  async submit(ev) { const { error } = await sb.from('events').insert(ev); if (error) throw error; },
  async session() { const { data } = await sb.auth.getSession(); return data.session; },
  async signIn(email, password) { const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; },
  async signOut() { await sb.auth.signOut(); },
  async isAdmin() { const { data } = await sb.rpc('is_admin'); return !!data; },
  async listByStatus(status) {
    const { data, error } = await sb.from('events').select('*').eq('status', status)
      .order(status === 'pending' ? 'created_at' : 'start_at', { ascending: status !== 'rejected' });
    if (error) throw error; return data;
  },
  async counts() {
    const out = {};
    await Promise.all(['pending', 'approved', 'rejected'].map(async s => {
      const { count } = await sb.from('events').select('id', { count: 'exact', head: true }).eq('status', s);
      out[s] = count || 0;
    }));
    return out;
  },
  async get(id) { const { data, error } = await sb.from('events').select('*').eq('id', id).maybeSingle(); if (error) throw error; return data; },
  async update(id, patch) {
    const { data, error } = await sb.from('events').update(patch).eq('id', id).select('id');
    if (error) throw error;
    if (!data.length) throw new Error('Not saved. Is your user in the admins table?');
  },
  async remove(id) { const { error } = await sb.from('events').delete().eq('id', id); if (error) throw error; },
  async movePoster(from, to) { const { error } = await sb.storage.from('posters').move(from, to); if (error) throw error; },
  async deletePosters(paths) { const { error } = await sb.storage.from('posters').remove(paths); if (error) throw error; }
};

// ------------------------------------------------------------------ state
const state = { events: [], going: {}, loc: null, loadedAt: 0, offline: false, cleanup: [],
  f: { kinds: new Set(), weekend: false, q: '', near: false } };
const goingMine = () => store.get('going', {});

async function ensureData(force = false) {
  if (!force && Date.now() - state.loadedAt < 60e3) return;
  try {
    const [evs, counts] = await Promise.all([api.listPublic(), api.goingCounts().catch(() => [])]);
    state.events = evs; state.offline = false;
    state.going = Object.fromEntries(counts.map(c => [`${c.event_id}|${c.occurrence_date}`, c.n]));
    try { store.set('cache', { evs, going: state.going, at: Date.now() }); } catch {}
  } catch (err) {
    const c = store.get('cache');
    if (!c) throw err;
    state.events = c.evs; state.going = c.going || {}; state.offline = c.at;
  }
  state.loadedAt = Date.now();
}

function requestLocation(quiet = false) {
  return new Promise(res => {
    if (!navigator.geolocation) { if (!quiet) toast('Location is not available on this device.'); return res(false); }
    navigator.geolocation.getCurrentPosition(
      p => { state.loc = [p.coords.latitude, p.coords.longitude]; store.set('locOk', true); res(true); },
      () => { if (!quiet) toast('Location is blocked. Allow it in your browser settings to sort by distance.'); res(false); },
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
  });
}

function upcomingOccs() {
  const now = new Date(), f = state.f;
  const horizon = new Date(now.getTime() + CFG.DAYS_AHEAD * DAY_MS), far = new Date(now.getTime() + 730 * DAY_MS);
  const [wkS, wkE] = weekendRange(now);
  const q = f.q.trim().toLowerCase();
  let rows = [];
  for (const ev of state.events) {
    if (f.kinds.size && !f.kinds.has(ev.kind)) continue;
    if (q && ![ev.title, ev.venue_name, ev.address, ev.description].join(' ').toLowerCase().includes(q)) continue;
    let occs = occurrences(ev, now, ev.recur_freq ? horizon : far);
    if (f.weekend) occs = occs.filter(o => o.start < wkE && (o.end || new Date(o.start.getTime() + DEFAULT_DUR)) > wkS);
    if (f.near) occs = occs.slice(0, 1);
    for (const o of occs) rows.push({ ev, o, d: evDist(ev) });
  }
  if (f.near) rows.sort((a, b) => (a.d ?? 1e9) - (b.d ?? 1e9) || a.o.start - b.o.start);
  else rows.sort((a, b) => a.o.start - b.o.start);
  return rows;
}

function cardHTML({ ev, o, d }) {
  const n = state.going[`${ev.id}|${o.key}`];
  const bits = [];
  if (ev.recur_freq) bits.push(esc(recurText(ev).replace(/ until .*/, '')));
  if (d != null) bits.push(fmtDist(d));
  if (n) bits.push(`${n} going`);
  return `<a class="card" href="#/e/${ev.id}/${o.key}">
    <div class="thumb">${posterHTML(ev, { thumb: true })}</div>
    <div>
      <span class="kind k-${esc(ev.kind)}">${KINDS[ev.kind] || ''}</span>
      <h3>${esc(ev.title)}</h3>
      <div class="meta">${state.f.near ? esc(fmtShort(o.start)) + ' · ' : ''}${esc(timeRange(o))}${ev.venue_name ? ' · ' + esc(ev.venue_name) : ''}</div>
      ${bits.length ? `<div class="meta">${bits.join(' · ')}</div>` : ''}
    </div></a>`;
}

function renderList() {
  const box = $('#list'); if (!box) return;
  const rows = upcomingOccs();
  let html = '';
  if (state.offline) html += `<div class="offline">Offline. Showing events saved ${esc(new Date(state.offline).toLocaleString())}.</div>`;
  if (!rows.length) {
    html += `<div class="empty"><p>${state.events.length ? 'No events match.' : 'No events listed yet. Be the first!'}</p><p><a class="btn primary" href="#/submit">Submit an event</a></p></div>`;
  } else if (state.f.near) {
    html += `<div class="day">Nearest first</div>` + rows.map(cardHTML).join('');
  } else {
    let last = '';
    for (const r of rows) {
      if (r.o.key !== last) { last = r.o.key; const lab = dayLabel(r.o.start); html += `<div class="day${lab === 'Today' ? ' today' : ''}">${esc(lab)}</div>`; }
      html += cardHTML(r);
    }
  }
  box.innerHTML = html;
}

async function viewMap(el) {

  if (!$('#map')) return;   // navigated away while loading
  const map = L.map('map').setView(state.loc || CFG.DEFAULT_CENTER, state.loc ? 11 : CFG.DEFAULT_ZOOM);
  state.cleanup.push(() => map.remove());
  addTiles(map);
  const pts = [];
  for (const ev of state.events) {
    if (ev.lat == null) continue;
    const o = nextOcc(ev); if (!o) continue;
    pts.push([ev.lat, ev.lng]);
    L.marker([ev.lat, ev.lng], { icon: pinIcon(ev.kind), title: ev.title }).addTo(map).bindPopup(
      `<span class="kind k-${esc(ev.kind)}">${KINDS[ev.kind]}</span><br><b>${esc(ev.title)}</b><br>
       ${esc(dayLabel(o.start))}, ${esc(fmtTime(o.start))}${ev.recur_freq ? '<br>' + esc(recurText(ev)) : ''}<br>
       ${esc(ev.venue_name || ev.address)}<br><a href="#/e/${ev.id}/${o.key}">Details →</a>`);
  }
  let me;
  const showMe = () => {
    if (!state.loc) return;
    me ? me.setLatLng(state.loc) : (me = L.marker(state.loc, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [16, 16] }), interactive: false }).addTo(map));
  };
  if (state.loc) showMe();
  else if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 12 });
  $('#locBtn').onclick = async () => { if (await requestLocation()) { showMe(); map.setView(state.loc, 11); } };
}

function setupEventForm(form, ev, admin) {
  const E = form.elements;
  const syncRepeat = () => {
    const sel = E.repeat, oN = sel.querySelector('[value=mN]'), oL = sel.querySelector('[value=mL]');
    if (E.date.value) {
      const d = parseKey(E.date.value), dn = DAY_NAMES[d.getDay()], nth = Math.ceil(d.getDate() / 7);
      const isLast = d.getDate() + 7 > new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      sel.querySelector('[value=w1]').textContent = `Every ${dn}`;
      sel.querySelector('[value=w2]').textContent = `Every other ${dn}`;
      oN.textContent = `Monthly on the ${ORD[nth] || ''} ${dn}`; oN.hidden = oN.disabled = nth > 4;
      oL.textContent = `Monthly on the last ${dn}`; oL.hidden = oL.disabled = !isLast;
      if (sel.selectedOptions[0]?.disabled) sel.value = isLast && sel.value === 'mN' ? 'mL' : sel.value === 'mL' && nth <= 4 ? 'mN' : '';
    }
    $('[data-until]', form).hidden = !sel.value;
  };
  E.date.onchange = syncRepeat; E.repeat.onchange = syncRepeat; syncRepeat();

  if (admin && ev.recur_freq) {
    const occs = occurrences(ev, startOfDay(new Date()), new Date(Date.now() + 200 * DAY_MS), { withSkipped: true }).slice(0, 16);
    $('#skips', form).innerHTML = occs.map(o => `<label class="check"><input type="checkbox" name="skip" value="${o.key}" ${o.skipped ? 'checked' : ''}> ${esc(fmtShort(o.start))}</label>`).join('')
      || '<span class="muted">No upcoming dates.</span>';
  }

  E.poster.onchange = () => {
    const f = E.poster.files[0], img = $('#posterPrev', form);
    if (!f) { img.hidden = true; return; }
    img.src = URL.createObjectURL(f); img.hidden = false;
  };

  // map picker
  let map, marker;
  const box = $('#pickMap', form), msg = $('#geoMsg', form);
  const setLL = ll => { E.lat.value = (+ll.lat).toFixed(6); E.lng.value = (+ll.lng).toFixed(6); };
  async function showMap(center, zoom, placePin) {
    box.hidden = false;
    await loadLeaflet();
    if (!map) {
      map = L.map(box).setView(center, zoom);
      state.cleanup.push(() => map.remove());
      addTiles(map);
      map.on('click', e => { placeMarker(e.latlng); setLL(e.latlng); msg.textContent = 'Pin placed. Drag it to adjust.'; });
    } else map.setView(center, zoom);
    if (placePin) { placeMarker(center); setLL({ lat: center[0], lng: center[1] }); }
    setTimeout(() => map.invalidateSize(), 60);
  }
  function placeMarker(ll) {
    if (marker) return marker.setLatLng(ll);
    marker = L.marker(ll, { draggable: true, icon: pinIcon(E.kind.value) }).addTo(map);
    marker.on('dragend', () => setLL(marker.getLatLng()));
  }
  $('#geoBtn', form).onclick = async () => {
    const q = E.address.value.trim();
    if (q.length < 5) { msg.textContent = 'Enter the address first.'; return; }
    msg.textContent = 'Looking up…';
    try {
      const r = await geocode(q);
      if (r) { await showMap([r.lat, r.lng], 16, true); msg.textContent = 'Found it. Drag the pin if it is not quite right.'; }
      else { await showMap(state.loc || CFG.DEFAULT_CENTER, state.loc ? 11 : CFG.DEFAULT_ZOOM, false); msg.textContent = "Couldn't find that address. Tap the map to place the pin."; }
    } catch { msg.textContent = 'Address lookup is unavailable right now. You can still submit.'; }
  };
  E.address.oninput = () => { if (E.lat.value) { E.lat.value = E.lng.value = ''; marker?.remove(); marker = null; msg.textContent = 'Address changed: press Find on map again.'; } };
  if (E.lat.value) showMap([+E.lat.value, +E.lng.value], 15, false).then(() => placeMarker([+E.lat.value, +E.lng.value]));
}

async function geocode(q) {
  const p = new URLSearchParams({ q, format: 'jsonv2', limit: '1' });
  if (CFG.GEOCODE_COUNTRIES) p.set('countrycodes', CFG.GEOCODE_COUNTRIES);
  // Prefer (not require) matches near home, so "120 Main St" finds the local one.
  const [lat, lng] = CFG.DEFAULT_CENTER;
  p.set('viewbox', [lng - 1.3, lat + 1, lng + 1.3, lat - 1].join(','));
  const r = await fetch('https://nominatim.openstreetmap.org/search?' + p, { headers: { 'Accept-Language': navigator.language || 'en' } });
  if (!r.ok) throw new Error('geocode ' + r.status);
  const j = await r.json();
  return j[0] ? { lat: +j[0].lat, lng: +j[0].lon } : null;
}

function readEventForm(form, admin) {
  const E = form.elements, errors = [];
  const t = k => (E[k]?.value || '').trim();
  if (t('company')) return { bot: true };
  const ev = { kind: t('kind'), title: t('title'), description: t('description') || null, entry_fee: t('entry_fee') || null,
    venue_name: t('venue_name') || null, address: t('address'), contact_name: t('contact_name') || null,
    contact_email: t('contact_email') || null, contact_phone: t('contact_phone') || null,
    website: t('website') || null, facebook: t('facebook') || null, instagram: t('instagram') || null, tiktok: t('tiktok') || null,
    submitter_email: t('submitter_email'), lat: t('lat') ? +t('lat') : null, lng: t('lng') ? +t('lng') : null };
  if (ev.title.length < 3) errors.push('Give the event a name.');
  if (ev.address.length < 5) errors.push('Enter the address.');
  if (!EMAIL_RE.test(ev.submitter_email)) errors.push(admin ? 'Submitter email is not valid.' : 'Enter your email so the admin can reach you.');
  if (ev.contact_email && !EMAIL_RE.test(ev.contact_email)) errors.push('The contact email is not valid.');
  if (ev.website && !webUrl(ev.website)) errors.push('The website link is not valid.');
  for (const k of ['facebook', 'instagram', 'tiktok']) if (ev[k] && !socialUrl(k, ev[k])) errors.push(`The ${k} link is not valid.`);
  if (!t('date') || !t('start')) errors.push('Enter the date and start time.');
  else {
    const [y, m, d] = t('date').split('-').map(Number), [sh, sm] = t('start').split(':').map(Number);
    const start = new Date(y, m - 1, d, sh, sm);
    let end = null;
    if (t('end')) { const [eh, em] = t('end').split(':').map(Number); end = new Date(y, m - 1, d, eh, em); if (end <= start) end.setDate(end.getDate() + 1); }
    ev.start_at = start.toISOString(); ev.end_at = end ? end.toISOString() : null;
    const rep = t('repeat'), dow = DAYS[start.getDay()];
    ev.recur_freq = rep ? (rep[0] === 'w' ? 'weekly' : 'monthly') : null;
    ev.recur_interval = rep === 'w2' ? 2 : 1;
    ev.recur_byday = !rep ? null : rep[0] === 'w' ? dow : rep === 'mL' ? '-1' + dow : Math.ceil(d / 7) + dow;
    ev.recur_until = rep && t('until') ? t('until') : null;
    if (ev.recur_until && ev.recur_until < t('date')) errors.push('"Until" is before the first date.');
    if (!admin && !rep && (end || new Date(start.getTime() + DEFAULT_DUR)) < new Date()) errors.push('That date has already passed.');
  }
  if (admin && E.skip) ev.skip_dates = $$('input[name=skip]', form).filter(c => c.checked).map(c => c.value);
  return { ev, errors };
}
function showFormErrors(form, errors) {
  const ul = $('#formErr', form);
  ul.innerHTML = errors.map(e => `<li>${esc(e)}</li>`).join('');
  ul.hidden = !errors.length;
  if (errors.length) ul.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

  const remembered = store.get('lastContact', {});

let adminTab = 'pending';
async function viewAdmin(el) {
  el.innerHTML = '<p class="empty">Loading…</p>';
  if (!(await adminGate(el))) return;
  const [counts, list] = await Promise.all([api.counts(), api.listByStatus(adminTab)]);
  const label = { pending: 'Pending', approved: 'Live', rejected: 'Rejected' };
  el.innerHTML = `<div style="display:flex;align-items:center;gap:10px"><h1 style="margin-right:auto">Admin</h1><button class="btn small" id="out">Sign out</button></div>
    <div class="tabs">${Object.keys(label).map(s => `<button class="chip ${s === adminTab ? 'on' : ''}" data-tab="${s}">${label[s]}${s === 'pending' && counts[s] ? `<span class="badge">${counts[s]}</span>` : ` (${counts[s]})`}</button>`).join('')}</div>
    <div id="admList">${list.length ? list.map(admCardHTML).join('') : `<p class="empty">Nothing ${label[adminTab].toLowerCase()}.</p>`}</div>`;
  $('#out', el).onclick = async () => { await api.signOut(); route(); };
  $$('[data-tab]', el).forEach(b => b.onclick = () => { adminTab = b.dataset.tab; viewAdmin(el); });
  $$('[data-act]', el).forEach(b => b.onclick = async () => {
    const ev = list.find(x => x.id === b.dataset.id), act = b.dataset.act;
    // Tap-twice confirm instead of confirm(): some browsers and installed
    // web apps suppress native dialogs, which made the button do nothing.
    if ((act === 'reject' || act === 'delete') && !b.dataset.armed) {
      const label = b.textContent;
      b.dataset.armed = '1';
      b.textContent = act === 'reject' ? 'Tap again to reject' : 'Tap again to delete';
      setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = label; } }, 4000);
      return;
    }
    b.disabled = true;
    try {
      if (act === 'approve') {
        const poster_path = ev.poster_path ? await movePoster(ev.poster_path, 'approved') : null;
        await api.update(ev.id, { status: 'approved', approved_at: new Date().toISOString(), poster_path });
        toast('Approved: it is live now.');
      } else if (act === 'reject') {
        await removePoster(ev.poster_path);
        await api.update(ev.id, { status: 'rejected', approved_at: null, poster_path: null });
      } else if (act === 'unpublish') {
        await api.update(ev.id, { status: 'pending', approved_at: null });
      } else if (act === 'delete') {
        await removePoster(ev.poster_path);
        await api.remove(ev.id);
      }
      state.loadedAt = 0;
      viewAdmin(el);
    } catch (err) { toast('Failed: ' + err.message); b.disabled = false; }
  });
}

async function viewAdminEdit(el, id) {
  el.innerHTML = '<p class="empty">Loading…</p>';

  el.innerHTML = `<p><a href="#/admin">← Admin</a></p><h1>Edit event</h1>
    <p class="muted">Status: <b>${esc(ev.status)}</b>. Saving keeps the status; approve from the list.</p>${eventFormHTML(ev, true)}`;
  const form = $('#evForm', el);

      if (patch.skip_dates) {   // keep cancellations that are already in the past

        patch.skip_dates = [...new Set([...(ev.skip_dates || []).filter(k => k < today), ...patch.skip_dates])].sort();
      } else if (!patch.recur_freq) patch.skip_dates = [];
      await api.update(ev.id, patch);
      state.loadedAt = 0;
      toast('Saved'); location.hash = '#/admin';
    } catch (err) { showFormErrors(form, ['Could not save: ' + err.message]); btn.disabled = false; btn.textContent = 'Save changes'; }
  };
}

// ------------------------------------------------------------------ router
const routes = [
  [/^#?\/?$/, viewList, 'list'],
  [/^#\/map$/, viewMap, 'map'],
  [/^#\/e\/([0-9a-f-]{36})(?:\/(\d{4}-\d\d-\d\d))?$/, viewDetail, 'list'],
  [/^#\/submit$/, viewSubmit, 'submit'],
  [/^#\/admin$/, viewAdmin, ''],
  [/^#\/admin\/e\/([0-9a-f-]{36})$/, viewAdminEdit, '']
];
function runCleanup() { while (state.cleanup.length) { try { state.cleanup.pop()(); } catch {} } }
function route() {
  runCleanup();
  const h = location.hash || '#/';
  const el = $('#view');
  el.className = '';
  for (const [re, fn, tab] of routes) {
    const m = re.exec(h);
    if (!m) continue;
    $$('.tabbar a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
    window.scrollTo(0, 0);
    Promise.resolve(fn(el, ...m.slice(1))).catch(err => { el.innerHTML = `<p class="empty err">${esc(err.message || err)}</p>`; });
    return;
  }
  location.hash = '#/';
}

  try { await api.init(); }
  catch (err) { $('#view').innerHTML = `<p class="empty err">${esc(err.message)}</p>`; return; }
  if (store.get('locOk')) requestLocation(true).then(ok => { if (ok) renderList(); });
  window.addEventListener('hashchange', route);
  route();
})();

let installEvt;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').hidden = false; });
$('#installBtn').onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('#installBtn').hidden = true; };

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w?.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller)
          toast('A new version is ready.', { label: 'Refresh', run: () => w.postMessage({ type: 'SKIP_WAITING' }) });
      });
    });
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
}
</script>
</body>
</html>
